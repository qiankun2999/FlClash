name: Build Windows and Android

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Client to package
        type: choice
        default: all
        options:
          - all
          - windows
          - android

permissions:
  contents: read

concurrency:
  group: build-clients-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  validate:
    name: Validate subscription updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/application.dart lib/bootstrap.dart
          lib/common/profile_update_scheduler.dart
          test/common/profile_update_scheduler_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip native hooks for focused Dart tests
        run: >-
          yq -i
          '.hooks.user_defines.setup.build_assets = false |
          .hooks.user_defines.rust_api.build_assets = false'
          pubspec.yaml

      - name: Test subscription updates
        run: >-
          flutter test
          test/common/profile_update_scheduler_test.dart
          test/providers/profiles_action_test.dart
          test/application_test.dart

  package:
    name: Package ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'android' && '[{"platform":"android","os":"ubuntu-latest"}]' || inputs.platform == 'windows' && '[{"platform":"windows","os":"windows-2022"}]' || '[{"platform":"windows","os":"windows-2022"},{"platform":"android","os":"ubuntu-latest"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable long paths
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        if: matrix.platform == 'android'

      - uses: nttld/setup-ndk@v1
        if: matrix.platform == 'android'
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Configure Android release signing when available
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
            printf 'keyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
              "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" >> android/local.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Package client
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          for attempt in 1 2 3; do
            if dart setup.dart "$TARGET_PLATFORM" -v; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "Packaging attempt $attempt failed; retrying with downloaded dependencies retained."
            sleep 10
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-${{ matrix.platform }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
